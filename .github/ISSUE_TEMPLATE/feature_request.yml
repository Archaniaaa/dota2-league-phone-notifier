name: Feature request
description: Suggest a focused, privacy-safe improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require automatic match acceptance, game input, memory reading, injection, traffic inspection, telemetry, advertising, or payments.
          required: true
